<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feriday — Peritajes en grafotecnia</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="brand"><span class="logo">◉</span> Feriday</div>
    <button class="menu">☰</button>
  </header>

  <main class="hero">
    <div class="content">
      <div class="eyebrow">◈ · INVESTIGACIÓN</div>
      <h1>Peritajes en<br><em>grafotecnia.</em></h1>
      <p>Peritos de parte en análisis de firmas y documentos con rigor técnico.</p>
      <a class="cta" href="#video">Ver el video</a>
    </div>

    <div class="visual" id="video">
      <div class="ring ring1"></div>
      <div class="ring ring2"></div>
      <video controls playsinline poster="">
        <source src="video.mp4" type="video/mp4">
        Tu navegador no puede reproducir este video.
      </video>
      <div class="feriday-watermark">FERIDAY</div>
    </div>
  </main>

  <section class="video-section">
    <h2>Conoce nuestro trabajo</h2>
    <p>Reemplaza <strong>video.mp4</strong> por tu video para verlo directamente en la página.</p>
  </section>
</body>
</html>
